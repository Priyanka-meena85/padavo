# ==============================================================================
# PADAVO PRODUCTION HIGH-PERFORMANCE NGINX REVERSE PROXY CONFIGURATION
# Terminates TLS 1.3 on Port 443 and proxies to Padavo Node.js on Port 5500
# Enforces HTTP/2, HSTS, Gzip compression, WebSockets, and zero server headers
# ==============================================================================

upstream padavo_backend {
    server 127.0.0.1:5500;
    keepalive 64;
}

# Redirect all plain HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name padavo.io www.padavo.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Main Reverse Proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name padavo.io www.padavo.io;

    # SSL Certificate Paths (Let's Encrypt / Cloudflare Origin)
    ssl_certificate /etc/letsencrypt/live/padavo.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/padavo.io/privkey.pem;

    # TLS 1.3 Hardened Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Enterprise Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip & Static Asset Acceleration
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/woff2;

    # Maximum Upload Size (Supports 4K QC inspection photos & chunks)
    client_max_body_size 50M;

    # Proxy Pass to Node.js Backend on Port 5500
    location / {
        proxy_pass http://padavo_backend;
        proxy_http_version 1.1;

        # WebSocket & Server-Sent Events (SSE) support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward Client IP and Host headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for live SSE milestone streams
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
