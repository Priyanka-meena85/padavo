version: '3.8'

services:
  padavo-core:
    build: .
    container_name: padavo_saas_core
    restart: unless-stopped
    ports:
      - "5500:5500"
    environment:
      - NODE_ENV=production
      - PORT=5500
      - R2_BUCKET=padavo-media-vault
      - R2_PUBLIC_DOMAIN=https://media.padavo.io
    volumes:
      - padavo_data:/app
      - padavo_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5500/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  padavo_data:
  padavo_uploads:
