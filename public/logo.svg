<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 120" width="450" height="120">
  <!-- PADAVO OFFICIAL VECTOR LOGO -->
  <!-- Globe & Waypoint Orbit Emblem -->
  <g transform="translate(12, 10)">
    <!-- Lower stem of 'P' -->
    <path d="M 33 58 L 24 96 L 39 92 L 44 58 Z" fill="#0b1b3d" />
    
    <!-- Main Globe -->
    <circle cx="58" cy="44" r="32" fill="#0b1b3d" />
    
    <!-- Continents Negative Space -->
    <path d="M 46 24 Q 54 22 62 25 Q 70 20 78 25 Q 83 30 81 37 Q 76 41 81 47 Q 77 53 69 50 Q 66 56 60 59 Q 57 51 50 49 Q 44 48 43 39 Q 44 32 46 24 Z" fill="#ffffff" />
    <path d="M 36 30 Q 40 26 44 32 Q 40 39 42 45 Q 46 50 44 57 Q 39 52 38 43 Z" fill="#ffffff" />
    <circle cx="83" cy="52" r="2.8" fill="#ffffff" />

    <!-- Dynamic Orange Milestone Trajectory Loop -->
    <path d="M 16 76 Q 10 58 26 46" stroke="#f27d00" stroke-width="4.8" fill="none" stroke-linecap="round" />
    <path d="M 22 49 Q 52 68 92 28 Q 102 33 99 48 Q 88 72 56 80 Q 36 84 16 76" fill="#f27d00" />

    <!-- 3 Milestone Waypoint Nodes -->
    <circle cx="22" cy="72" r="5" fill="#ffffff" stroke="#f27d00" stroke-width="2.5" />
    <circle cx="22" cy="72" r="2" fill="#f27d00" />

    <circle cx="55" cy="64" r="5.5" fill="#ffffff" stroke="#f27d00" stroke-width="2.8" />
    <circle cx="55" cy="64" r="2.2" fill="#f27d00" />

    <circle cx="90" cy="40" r="5" fill="#ffffff" stroke="#f27d00" stroke-width="2.5" />
    <circle cx="90" cy="40" r="2" fill="#f27d00" />
  </g>

  <!-- Wordmark: PADAVO -->
  <g transform="translate(138, 22)">
    <!-- P -->
    <path d="M 10 72 L 10 6 L 36 6 Q 52 6 52 24 Q 52 42 36 42 L 26 42 L 26 72 Z M 26 28 L 34 28 Q 38 28 38 24 Q 38 20 34 20 L 26 20 Z" fill="#0b1b3d" />

    <!-- A (with orange accent triangle) -->
    <g transform="translate(56, 0)">
      <path d="M 28 6 L 48 72 L 32 72 L 27 56 L 15 56 L 10 72 L -6 72 Z" fill="#0b1b3d" />
      <polygon points="21,22 13,44 29,44" fill="#f27d00" />
    </g>

    <!-- D -->
    <g transform="translate(112, 0)">
      <path d="M 10 72 L 10 6 L 30 6 Q 56 6 56 39 Q 56 72 30 72 Z M 26 56 L 30 56 Q 40 56 40 39 Q 40 22 30 22 L 26 22 Z" fill="#0b1b3d" />
    </g>

    <!-- A -->
    <g transform="translate(172, 0)">
      <path d="M 28 6 L 48 72 L 32 72 L 27 56 L 15 56 L 10 72 L -6 72 Z" fill="#0b1b3d" />
      <polygon points="21,24 14,46 28,46" fill="#0b1b3d" />
    </g>

    <!-- V -->
    <g transform="translate(228, 0)">
      <path d="M 2 6 L 18 6 L 28 50 L 38 6 L 54 6 L 36 72 L 20 72 Z" fill="#0b1b3d" />
    </g>

    <!-- O -->
    <g transform="translate(286, 0)">
      <path d="M 26 6 Q 48 6 48 39 Q 48 72 26 72 Q 4 72 4 39 Q 4 6 26 6 Z M 26 56 Q 34 56 34 39 Q 34 22 26 22 Q 18 22 18 39 Q 18 56 26 56 Z" fill="#0b1b3d" />
    </g>
  </g>
</svg>
